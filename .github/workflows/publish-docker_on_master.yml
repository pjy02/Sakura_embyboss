name: Publish Latest Docker image

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: publish-latest
  cancel-in-progress: false

jobs:
  checks:
    name: Test source
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish latest multi-architecture image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: checks
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify Docker Hub secrets
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN || secrets.DOCKER_PASSWORD }}
        run: |
          test -n "${DOCKER_USERNAME}" || (echo "Missing DOCKER_USERNAME" && exit 1)
          test -n "${DOCKER_TOKEN}" || (echo "Missing DOCKER_TOKEN (or legacy DOCKER_PASSWORD)" && exit 1)

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN || secrets.DOCKER_PASSWORD }}
          scope: ${{ secrets.DOCKER_USERNAME }}/sakura_embyboss@push

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/sakura_embyboss
          flavor: latest=false
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,mode=max,scope=release-image
          provenance: mode=max
          sbom: true

      - name: Write summary
        run: |
          echo "### Docker Hub publish completed" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Image: \`${{ secrets.DOCKER_USERNAME }}/sakura_embyboss:latest\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Digest: \`${{ steps.build.outputs.digest }}\`" >> "${GITHUB_STEP_SUMMARY}"
