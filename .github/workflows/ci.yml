name: Sakura v3 CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "v3/**"
      - "go.work"
      - ".github/workflows/ci.yml"
  push:
    paths:
      - "v3/**"
      - "go.work"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: v3-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web generated client, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: v3/web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go for OpenAPI generation
        uses: actions/setup-go@v6
        with:
          go-version-file: v3/go.mod
          cache-dependency-path: v3/go.sum

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v3/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify generated OpenAPI client
        run: npm run generate:api && git diff --exit-code -- src/generated/client.ts

      - name: Typecheck and unit tests
        run: npm run typecheck && npm run test

      - name: Build production Web
        run: npm exec vite build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v3-playwright-report
          path: v3/web/playwright-report
          retention-days: 7

  go:
    name: Go architecture and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: v3
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sakura_test
          POSTGRES_USER: sakura
          POSTGRES_PASSWORD: sakura-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sakura -d sakura_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      SAKURA_V3_TEST_DATABASE_URL: postgres://sakura:sakura-test-password@127.0.0.1:5432/sakura_test?sslmode=disable
      SAKURA_V3_TEST_REDIS_ADDRESS: 127.0.0.1:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: v3/go.mod
          cache-dependency-path: v3/go.sum

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Verify module files
        run: go mod tidy && git diff --exit-code -- go.mod go.sum

      - name: Unit and migration idempotency tests
        run: go test -race ./...

      - name: Static analysis
        run: go vet ./...

      - name: Build independent entrypoints
        run: |
          go build -o "${RUNNER_TEMP}/sakura-api" ./cmd/api
          go build -o "${RUNNER_TEMP}/sakura-worker" ./cmd/worker
          go build -o "${RUNNER_TEMP}/sakura-bot" ./cmd/bot
          go build -o "${RUNNER_TEMP}/sakura-migrate" ./cmd/migrate
          go build -o "${RUNNER_TEMP}/sakura-import-v2" ./cmd/import-v2
          go build -o "${RUNNER_TEMP}/sakura-reconcile-v2" ./cmd/reconcile-v2

  container:
    name: Compose and container build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Compose
        working-directory: v3
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose -f deploy/compose.maintenance.yaml config --quiet
          docker compose -f deploy/compose.restore-drill.yaml config --quiet

      - name: Validate phase 8 operations and blue-green topology
        working-directory: v3
        env:
          SAKURA_V3_COLOR: blue
          SAKURA_V3_COLOR_API_PORT: 18080
          SAKURA_V3_COLOR_WEB_PORT: 18088
          SAKURA_V3_IMAGE: example/sakura_embyboss@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          SAKURA_V3_WEB_IMAGE: example/sakura_embyboss@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          SAKURA_V3_DATABASE_URL: postgres://sakura:test@postgres:5432/sakura?sslmode=disable
          SAKURA_V3_REDIS_PASSWORD: test-only
          SAKURA_V3_CREDENTIAL_MASTER_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          SAKURA_V3_INTERNAL_BOT_TOKEN: test-only-internal-token-with-32-chars
        run: |
          bash -n ops/*.sh
          docker compose -f deploy/compose.color.yaml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build v3 image
        uses: docker/build-push-action@v7
        with:
          context: ./v3
          file: ./v3/Dockerfile
          platforms: linux/amd64
          push: false
          tags: sakura-v3:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=v3-ci
          cache-to: type=gha,mode=max,scope=v3-ci
          provenance: false
          sbom: false

      - name: Build v3 Web image
        uses: docker/build-push-action@v7
        with:
          context: ./v3
          file: ./v3/web/Dockerfile
          platforms: linux/amd64
          push: false
          tags: sakura-v3-web:ci
          cache-from: type=gha,scope=v3-web-ci
          cache-to: type=gha,mode=max,scope=v3-web-ci
          provenance: false
          sbom: false
