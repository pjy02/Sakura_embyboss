openapi: 3.1.0
info:
  title: Sakura v3 API
  version: 3.0.0-alpha.1
  description: Unified API used equally by the Web portal, Telegram Bot and API clients.
servers:
  - url: /
paths:
  /health/live:
    get:
      operationId: getLiveness
      tags: [System]
      responses:
        "200":
          description: The API process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      operationId: getReadiness
      tags: [System]
      responses:
        "200":
          description: Required API dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: At least one required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v3/system/info:
    get:
      operationId: getSystemInfo
      tags: [System]
      responses:
        "200":
          description: Public API process information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
  /api/v3/auth/register:
    post:
      operationId: registerLocalAccount
      tags: [Authentication]
      summary: Register a Web account without Telegram.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201": {description: Account created}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v3/auth/login:
    post:
      operationId: loginLocalAccount
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session cookie and CSRF token created.
          headers:
            Set-Cookie: {schema: {type: string}}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v3/auth/session:
    get:
      operationId: getSession
      tags: [Authentication]
      security: [{cookieAuth: []}]
      responses:
        "200": {description: Current account}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v3/auth/logout:
    post:
      operationId: logout
      tags: [Authentication]
      security: [{cookieAuth: [], csrfHeader: []}]
      responses:
        "204": {description: Session revoked}
  /api/v3/me:
    get:
      operationId: getCurrentAccount
      tags: [Accounts]
      security: [{cookieAuth: []}]
      responses:
        "200": {description: Unified account and identities}
  /api/v3/me/telegram/link-requests:
    post:
      operationId: createTelegramLinkRequest
      tags: [Identities]
      security: [{cookieAuth: [], csrfHeader: []}]
      responses:
        "201": {description: One-time binding code created}
  /api/v3/me/telegram/link-requests/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getTelegramLinkRequest
      tags: [Identities]
      security: [{cookieAuth: []}]
      responses:
        "200": {description: Binding state}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v3/admin/accounts:
    get:
      operationId: listAccounts
      tags: [Administration]
      security: [{cookieAuth: []}]
      responses:
        "200": {description: Accounts visible to accounts.read}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v3/admin/accounts/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getAccount
      tags: [Administration]
      security: [{cookieAuth: []}]
      responses:
        "200": {description: Unified account detail}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v3/admin/accounts/{id}/lifecycle:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      operationId: changeAccountLifecycle
      tags: [Administration]
      security: [{cookieAuth: [], csrfHeader: []}]
      responses:
        "200": {description: Lifecycle changed and inactive sessions revoked}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v3/admin/accounts/{id}/roles:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: assignAccountRoles
      tags: [RBAC]
      security: [{cookieAuth: [], csrfHeader: []}]
      responses:
        "200": {description: Role assignment replaced}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v3/admin/roles:
    get:
      operationId: listRoles
      tags: [RBAC]
      security: [{cookieAuth: []}]
      responses:
        "200": {description: Roles and permissions}
  /api/v3/admin/permissions:
    get:
      operationId: listPermissions
      tags: [RBAC]
      security: [{cookieAuth: []}]
      responses:
        "200": {description: Permission catalog}
  /api/v3/admin/roles/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema: {type: string}
    put:
      operationId: saveCustomRole
      tags: [RBAC]
      security: [{cookieAuth: [], csrfHeader: []}]
      responses:
        "200": {description: Custom role saved}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v3/admin/settings:
    get:
      operationId: listDynamicSettings
      tags: [Settings]
      security: [{cookieAuth: []}]
      responses:
        "200": {description: Current versioned settings}
  /api/v3/admin/settings/{key}:
    parameters:
      - $ref: "#/components/parameters/SettingKey"
    patch:
      operationId: updateDynamicSetting
      tags: [Settings]
      security: [{cookieAuth: [], csrfHeader: []}]
      responses:
        "200": {description: New setting revision}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v3/admin/settings/{key}/history:
    parameters:
      - $ref: "#/components/parameters/SettingKey"
    get:
      operationId: getDynamicSettingHistory
      tags: [Settings]
      security: [{cookieAuth: []}]
      responses:
        "200": {description: Immutable setting revisions}
  /api/v3/admin/settings/{key}/rollback:
    parameters:
      - $ref: "#/components/parameters/SettingKey"
    post:
      operationId: rollbackDynamicSetting
      tags: [Settings]
      security: [{cookieAuth: [], csrfHeader: []}]
      responses:
        "200": {description: Rollback recorded as a new revision}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v3/admin/credentials:
    get:
      operationId: listCredentialMetadata
      tags: [Credentials]
      security: [{cookieAuth: []}]
      responses:
        "200": {description: Masked credential metadata}
  /api/v3/admin/credentials/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: {type: string}
    put:
      operationId: putCredential
      tags: [Credentials]
      security: [{cookieAuth: [], csrfHeader: []}]
      responses:
        "200": {description: Credential encrypted at rest}
    delete:
      operationId: deleteCredential
      tags: [Credentials]
      security: [{cookieAuth: [], csrfHeader: []}]
      responses:
        "204": {description: Credential deleted}
  /api/v3/admin/api-scopes:
    get:
      operationId: listAPIScopes
      tags: [API Clients]
      security: [{cookieAuth: []}]
      responses:
        "200": {description: Supported scope catalog}
  /api/v3/admin/api-clients:
    get:
      operationId: listAPIClients
      tags: [API Clients]
      security: [{cookieAuth: []}]
      responses:
        "200": {description: API clients without token secrets}
    post:
      operationId: createAPIClient
      tags: [API Clients]
      security: [{cookieAuth: [], csrfHeader: []}]
      responses:
        "201": {description: API token returned once}
  /api/v3/admin/api-clients/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    delete:
      operationId: revokeAPIClient
      tags: [API Clients]
      security: [{cookieAuth: [], csrfHeader: []}]
      responses:
        "204": {description: Client revoked}
  /api/v3/admin/audit:
    get:
      operationId: listAuditLogs
      tags: [Audit]
      security: [{cookieAuth: []}]
      responses:
        "200": {description: Immutable management audit trail}
  /api/v3/membership-plans:
    get:
      operationId: listPublicMembershipPlans
      tags: [Membership]
      responses:
        "200": {description: Enabled membership plans and entitlements}
  /api/v3/me/membership:
    get:
      operationId: getMyMembership
      tags: [Membership]
      security: [{cookieAuth: []}]
      responses:
        "200": {description: Current membership}
  /api/v3/me/invitations/redeem:
    post:
      operationId: redeemInvitation
      tags: [Invitations]
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      responses:
        "200": {description: Membership activated or renewed idempotently}
  /api/v3/me/emby-bindings:
    get:
      operationId: listMyEmbyBindings
      tags: [Emby]
      security: [{cookieAuth: []}]
      responses:
        "200": {description: Bindings across all Emby instances}
  /api/v3/me/emby/provision-requests:
    post:
      operationId: requestEmbyProvisioning
      tags: [Emby]
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      responses:
        "202": {description: Idempotent asynchronous provisioning task}
  /api/v3/me/emby/provision-requests/{id}:
    parameters: [{$ref: "#/components/parameters/ID"}]
    get:
      operationId: getMyEmbyProvisioning
      tags: [Emby]
      security: [{cookieAuth: []}]
      responses: {"200": {description: Task state and time-limited generated password}}
  /api/v3/me/emby-claims:
    post:
      operationId: claimImportedEmbyUser
      tags: [Emby]
      security: [{cookieAuth: [], csrfHeader: []}]
      responses: {"201": {description: Remote user bound to current account}}
  /api/v3/admin/membership-plans:
    get:
      operationId: listMembershipPlans
      tags: [Administration, Membership]
      security: [{cookieAuth: []}]
      responses: {"200": {description: All membership plans}}
    post:
      operationId: createMembershipPlan
      tags: [Administration, Membership]
      security: [{cookieAuth: [], csrfHeader: []}]
      responses: {"201": {description: Plan created}}
  /api/v3/admin/membership-plans/{id}:
    parameters: [{$ref: "#/components/parameters/ID"}]
    put:
      operationId: updateMembershipPlan
      tags: [Administration, Membership]
      security: [{cookieAuth: [], csrfHeader: []}]
      responses: {"200": {description: Plan updated with optimistic revision check}}
  /api/v3/admin/accounts/{id}/membership:
    parameters: [{$ref: "#/components/parameters/ID"}]
    post:
      operationId: assignMembership
      tags: [Administration, Membership]
      security: [{cookieAuth: [], csrfHeader: []}]
      responses: {"200": {description: Membership assigned or extended}}
  /api/v3/admin/invitations:
    get:
      operationId: listInvitations
      tags: [Administration, Invitations]
      security: [{cookieAuth: []}]
      responses: {"200": {description: Masked invitation metadata}}
    post:
      operationId: generateInvitations
      tags: [Administration, Invitations]
      security: [{cookieAuth: [], csrfHeader: []}]
      responses: {"201": {description: Raw invitation codes returned once}}
  /api/v3/admin/invitations/{id}:
    parameters: [{$ref: "#/components/parameters/ID"}]
    delete:
      operationId: revokeInvitation
      tags: [Administration, Invitations]
      security: [{cookieAuth: [], csrfHeader: []}]
      responses: {"204": {description: Invitation revoked}}
  /api/v3/admin/emby/instances:
    get:
      operationId: listEmbyInstances
      tags: [Administration, Emby]
      security: [{cookieAuth: []}]
      responses: {"200": {description: Instances and health}}
    post:
      operationId: createEmbyInstance
      tags: [Administration, Emby]
      security: [{cookieAuth: [], csrfHeader: []}]
      responses: {"201": {description: Instance created}}
  /api/v3/admin/emby/instances/{id}:
    parameters: [{$ref: "#/components/parameters/ID"}]
    put:
      operationId: updateEmbyInstance
      tags: [Administration, Emby]
      security: [{cookieAuth: [], csrfHeader: []}]
      responses: {"200": {description: Instance updated}}
  /api/v3/admin/emby/bindings:
    get:
      operationId: listEmbyBindings
      tags: [Administration, Emby]
      security: [{cookieAuth: []}]
      responses: {"200": {description: Account bindings across instances}}
  /api/v3/admin/emby/remote-users:
    get:
      operationId: listImportedEmbyUsers
      tags: [Administration, Emby]
      security: [{cookieAuth: []}]
      responses: {"200": {description: Imported, claimable and missing remote users}}
  /api/v3/admin/emby/remote-users/{id}/claim-token:
    parameters: [{$ref: "#/components/parameters/ID"}]
    post:
      operationId: createEmbyClaimToken
      tags: [Administration, Emby]
      security: [{cookieAuth: [], csrfHeader: []}]
      responses: {"201": {description: One-time claim token returned once}}
  /api/v3/admin/emby/remote-users/{id}/claim:
    parameters: [{$ref: "#/components/parameters/ID"}]
    post:
      operationId: adminClaimEmbyUser
      tags: [Administration, Emby]
      security: [{cookieAuth: [], csrfHeader: []}]
      responses: {"201": {description: Remote user assigned to an account}}
  /api/v3/admin/emby/instances/{id}/adopt-legacy:
    parameters: [{$ref: "#/components/parameters/ID"}]
    post:
      operationId: adoptLegacyEmbyIdentities
      tags: [Administration, Emby]
      security: [{cookieAuth: [], csrfHeader: []}]
      responses: {"200": {description: v2 Emby identities converted to instance bindings}}
  /api/v3/admin/emby/instances/{id}/tasks:
    parameters: [{$ref: "#/components/parameters/ID"}]
    post:
      operationId: enqueueEmbyInstanceTask
      tags: [Administration, Emby]
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      responses: {"202": {description: Import, sync or reconciliation task queued}}
  /api/v3/admin/emby/tasks:
    get:
      operationId: listEmbyTasks
      tags: [Administration, Emby]
      security: [{cookieAuth: []}]
      responses: {"200": {description: Provision, import, sync and reconciliation tasks}}
  /api/v3/admin/emby/tasks/{id}/retry:
    parameters: [{$ref: "#/components/parameters/ID"}]
    post:
      operationId: retryEmbyTask
      tags: [Administration, Emby]
      security: [{cookieAuth: [], csrfHeader: []}]
      responses: {"202": {description: Failed task reset for retry}}
  /api/v3/admin/emby/instances/{id}/snapshots:
    parameters: [{$ref: "#/components/parameters/ID"}]
    get:
      operationId: listEmbySnapshots
      tags: [Administration, Emby]
      security: [{cookieAuth: []}]
      responses: {"200": {description: Immutable remote state snapshots}}
  /api/v3/recharge-products:
    get:
      operationId: listPublicRechargeProducts
      tags: [Commerce]
      responses: {"200": {description: Enabled wallet recharge products}}
  /api/v3/membership-products:
    get:
      operationId: listPublicMembershipProducts
      tags: [Commerce]
      responses: {"200": {description: Enabled membership products}}
  /api/v3/me/wallet:
    get:
      operationId: getMyWallet
      tags: [Wallet]
      security: [{cookieAuth: []}]
      responses: {"200": {description: Balance derived from posted ledger entries}}
  /api/v3/me/wallet/ledger:
    get:
      operationId: listMyLedger
      tags: [Wallet]
      security: [{cookieAuth: []}]
      responses: {"200": {description: Immutable balanced transactions}}
  /api/v3/me/recharge-orders:
    get:
      operationId: listMyRechargeOrders
      tags: [Commerce]
      security: [{cookieAuth: []}]
      responses: {"200": {description: Current account recharge orders}}
    post:
      operationId: createRechargeOrder
      tags: [Commerce]
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      responses: {"201": {description: Pending recharge order created idempotently}}
  /api/v3/me/recharge-orders/{id}:
    parameters: [{$ref: "#/components/parameters/ID"}]
    get:
      operationId: getMyRechargeOrder
      tags: [Commerce]
      security: [{cookieAuth: []}]
      responses: {"200": {description: Recharge order owned by current account}}
  /api/v3/me/membership-purchases:
    post:
      operationId: purchaseMembershipWithWallet
      tags: [Commerce, Membership]
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      responses: {"201": {description: Balanced wallet debit and membership extension}}
  /api/v3/me/notifications:
    get:
      operationId: listMyNotifications
      tags: [Notifications]
      security: [{cookieAuth: []}]
      responses: {"200": {description: Notifications addressed to current account}}
  /api/v3/me/notifications/{id}/read:
    parameters: [{$ref: "#/components/parameters/ID"}]
    post:
      operationId: markNotificationRead
      tags: [Notifications]
      security: [{cookieAuth: [], csrfHeader: []}]
      responses: {"204": {description: Notification marked read}}
  /api/v3/internal/payments/{provider}/callback:
    parameters:
      - name: provider
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: confirmPaymentCallback
      tags: [Internal, Commerce]
      security: [{bearerAuth: []}]
      responses: {"200": {description: Callback recorded and credited exactly once}}
  /api/v3/internal/notifications/telegram/next:
    get:
      operationId: claimTelegramNotification
      tags: [Internal, Notifications]
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Leased Telegram notification}
        "204": {description: No pending notification}
  /api/v3/admin/recharge-products:
    get:
      operationId: listAllRechargeProducts
      tags: [Administration, Commerce]
      security: [{cookieAuth: []}]
      responses: {"200": {description: All recharge products}}
    post:
      operationId: createRechargeProduct
      tags: [Administration, Commerce]
      security: [{cookieAuth: [], csrfHeader: []}]
      responses: {"201": {description: Recharge product created}}
  /api/v3/admin/membership-products:
    get:
      operationId: listAllMembershipProducts
      tags: [Administration, Commerce]
      security: [{cookieAuth: []}]
      responses: {"200": {description: All membership products}}
    post:
      operationId: createMembershipProduct
      tags: [Administration, Commerce]
      security: [{cookieAuth: [], csrfHeader: []}]
      responses: {"201": {description: Membership product created}}
  /api/v3/admin/recharge-orders:
    get:
      operationId: listRechargeOrders
      tags: [Administration, Commerce]
      security: [{cookieAuth: []}]
      responses: {"200": {description: Recharge orders across accounts}}
  /api/v3/admin/recharge-refunds:
    get:
      operationId: listRechargeRefunds
      tags: [Administration, Commerce]
      security: [{cookieAuth: []}]
      responses: {"200": {description: Posted recharge refunds}}
  /api/v3/admin/recharge-orders/{id}/refunds:
    parameters: [{$ref: "#/components/parameters/ID"}]
    post:
      operationId: refundRechargeOrder
      tags: [Administration, Commerce]
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      responses: {"201": {description: Refund reversal posted}}
  /api/v3/admin/accounts/{id}/wallet-adjustments:
    parameters: [{$ref: "#/components/parameters/ID"}]
    post:
      operationId: adjustAccountWallet
      tags: [Administration, Wallet]
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      responses: {"201": {description: Audited balanced adjustment posted}}
  /api/v3/admin/accounts/{id}/wallet:
    parameters: [{$ref: "#/components/parameters/ID"}]
    get:
      operationId: getAccountWallet
      tags: [Administration, Wallet]
      security: [{cookieAuth: []}]
      responses: {"200": {description: Derived account balance}}
  /api/v3/admin/account-tags:
    get:
      operationId: listAccountTags
      tags: [Administration, Batch Operations]
      security: [{cookieAuth: []}]
      responses: {"200": {description: Account tag catalog}}
    post:
      operationId: createAccountTag
      tags: [Administration, Batch Operations]
      security: [{cookieAuth: [], csrfHeader: []}]
      responses: {"201": {description: Account tag created}}
  /api/v3/admin/batch-operations:
    get:
      operationId: listBatchOperations
      tags: [Administration, Batch Operations]
      security: [{cookieAuth: []}]
      responses: {"200": {description: Durable batch operation progress}}
    post:
      operationId: createBatchOperation
      tags: [Administration, Batch Operations]
      security: [{cookieAuth: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      responses: {"202": {description: Stable target set queued for processing}}
  /api/v3/admin/batch-operations/{id}:
    parameters: [{$ref: "#/components/parameters/ID"}]
    get:
      operationId: getBatchOperation
      tags: [Administration, Batch Operations]
      security: [{cookieAuth: []}]
      responses: {"200": {description: Counts, state and last error}}
  /api/v3/admin/batch-operations/{id}/items:
    parameters: [{$ref: "#/components/parameters/ID"}]
    get:
      operationId: listBatchOperationItems
      tags: [Administration, Batch Operations]
      security: [{cookieAuth: []}]
      responses: {"200": {description: Per-account status and error details}}
  /api/v3/admin/batch-operations/{id}/pause:
    parameters: [{$ref: "#/components/parameters/ID"}]
    post:
      operationId: pauseBatchOperation
      tags: [Administration, Batch Operations]
      security: [{cookieAuth: [], csrfHeader: []}]
      responses: {"200": {description: Pending execution paused}}
  /api/v3/admin/batch-operations/{id}/resume:
    parameters: [{$ref: "#/components/parameters/ID"}]
    post:
      operationId: resumeBatchOperation
      tags: [Administration, Batch Operations]
      security: [{cookieAuth: [], csrfHeader: []}]
      responses: {"200": {description: Paused execution resumed}}
  /api/v3/admin/batch-operations/{id}/retry:
    parameters: [{$ref: "#/components/parameters/ID"}]
    post:
      operationId: retryBatchOperation
      tags: [Administration, Batch Operations]
      security: [{cookieAuth: [], csrfHeader: []}]
      responses: {"200": {description: Failed items queued again}}
  /api/v3/admin/batch-operations/{id}/cancel:
    parameters: [{$ref: "#/components/parameters/ID"}]
    post:
      operationId: cancelBatchOperation
      tags: [Administration, Batch Operations]
      security: [{cookieAuth: [], csrfHeader: []}]
      responses: {"200": {description: Operation canceled}}
  /api/v3/me/playback/online:
    get:
      operationId: listMyOnlinePlayback
      tags: [Playback]
      security: [{cookieAuth: []}]
      responses: {"200": {description: Current playback sessions owned by the account}}
  /api/v3/me/playback/history:
    get:
      operationId: listMyPlaybackHistory
      tags: [Playback]
      security: [{cookieAuth: []}]
      responses: {"200": {description: Playback history owned by the account}}
  /api/v3/me/devices:
    get:
      operationId: listMyDevices
      tags: [Devices]
      security: [{cookieAuth: []}]
      responses: {"200": {description: Device profiles observed for the account}}
  /api/v3/admin/playback/online:
    get:
      operationId: listOnlinePlayback
      tags: [Administration, Playback]
      security: [{cookieAuth: []}]
      responses: {"200": {description: Current playback across isolated Emby instances}}
  /api/v3/admin/playback/history:
    get:
      operationId: listPlaybackHistory
      tags: [Administration, Playback]
      security: [{cookieAuth: []}]
      responses: {"200": {description: Historical playback snapshots}}
  /api/v3/admin/devices:
    get:
      operationId: listDeviceProfiles
      tags: [Administration, Devices]
      security: [{cookieAuth: []}]
      responses: {"200": {description: Aggregated device identities and access decisions}}
  /api/v3/admin/device-rules:
    get:
      operationId: listDeviceRules
      tags: [Administration, Devices]
      security: [{cookieAuth: []}]
      responses: {"200": {description: Built-in and custom allow or deny rules}}
    post:
      operationId: createDeviceRule
      tags: [Administration, Devices]
      security: [{cookieAuth: [], csrfHeader: []}]
