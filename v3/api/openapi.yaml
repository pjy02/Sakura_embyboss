components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sakura_v3_session
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 160}
    ID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    SettingKey:
      name: key
      in: path
      required: true
      schema: {type: string}
  responses:
    BadRequest: {description: Invalid request}
    Unauthorized: {description: Authentication required or invalid}
    Forbidden: {description: Permission, CSRF token, or scope denied}
    NotFound: {description: Resource not found}
    Conflict: {description: Revision or uniqueness conflict}
  schemas:
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string, minLength: 3, maxLength: 32}
        password: {type: string, minLength: 10, maxLength: 128}
        display_name: {type: string, maxLength: 255}
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string}
        password: {type: string}
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
        service:
          type: string
        components:
          type: object
          additionalProperties:
            type: string
    SystemInfo:
      type: object
      required: [name, version, service, environment]
      properties:
        name:
          type: string
          const: Sakura
        version:
          type: string
        service:
          type: string
          const: api
        environment:
          type: string
