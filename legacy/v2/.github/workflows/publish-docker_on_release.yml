name: Publish Release Docker image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Docker version tag, for example v2.1.0
        required: true
        type: string
      publish_latest:
        description: Also update the latest tag
        required: true
        default: true
        type: boolean
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  checks:
    name: Test source
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish versioned multi-architecture image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: checks
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve and validate version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: |
          if [[ "${EVENT_NAME}" == "release" ]]; then
            value="${RELEASE_VERSION}"
            [[ "${RELEASE_PRERELEASE}" == "true" ]] && latest=false || latest=true
          else
            value="${INPUT_VERSION}"
            latest="${INPUT_PUBLISH_LATEST}"
          fi
          if [[ ! "${value}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like v2.1.0 or 2.1.0-rc.1"
            exit 1
          fi
          echo "value=${value}" >> "${GITHUB_OUTPUT}"
          echo "latest=${latest}" >> "${GITHUB_OUTPUT}"

      - name: Verify Docker Hub secrets
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN || secrets.DOCKER_PASSWORD }}
        run: |
          test -n "${DOCKER_USERNAME}" || (echo "Missing DOCKER_USERNAME" && exit 1)
          test -n "${DOCKER_TOKEN}" || (echo "Missing DOCKER_TOKEN (or legacy DOCKER_PASSWORD)" && exit 1)

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN || secrets.DOCKER_PASSWORD }}
          scope: ${{ secrets.DOCKER_USERNAME }}/sakura_embyboss@push

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/sakura_embyboss
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=semver,pattern={{version}},value=${{ steps.version.outputs.value }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.value }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.value }}
            type=raw,value=latest,enable=${{ steps.version.outputs.latest == 'true' }}
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,mode=max,scope=release-image
          provenance: mode=max
          sbom: true

      - name: Write summary
        run: |
          echo "### Docker Hub release completed" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Version: \`${{ steps.version.outputs.value }}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Digest: \`${{ steps.build.outputs.digest }}\`" >> "${GITHUB_STEP_SUMMARY}"
