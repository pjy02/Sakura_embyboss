name: sakura-embyboss

x-app-environment: &app-environment
  TZ: ${TZ:-Asia/Shanghai}
  SAKURA_DB_HOST: mysql
  SAKURA_DB_PORT: "3306"
  SAKURA_DB_NAME: ${MYSQL_DATABASE:-embyboss}
  SAKURA_DB_USER: ${MYSQL_USER:-sakura}
  SAKURA_DB_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
  SAKURA_DB_IS_DOCKER: "1"
  SAKURA_DB_CONTAINER: mysql
  SAKURA_CONFIG_SAVE_ON_START: "0"
  SAKURA_CREDENTIAL_MASTER_KEY: ${SAKURA_CREDENTIAL_MASTER_KEY:-}

x-app-volumes: &app-volumes
  - ./config.json:/app/config.json
  - ./log:/app/log
  - ./db_backup:/app/db_backup

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-embyboss}
      MYSQL_USER: ${MYSQL_USER:-sakura}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h 127.0.0.1 -uroot --silent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - sakura

  migrate:
    image: ${SAKURA_IMAGE:?请在 .env 中设置 SAKURA_IMAGE}
    restart: "no"
    command:
      - -c
      - import bot.sql_helper
    environment: *app-environment
    volumes: *app-volumes
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sakura

  bot:
    image: ${SAKURA_IMAGE:?请在 .env 中设置 SAKURA_IMAGE}
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      <<: *app-environment
      SAKURA_EMBEDDED_WEB_ENABLED: "0"
      # Bot validates the one-time login token created by the Web process.
      SAKURA_WEB_SESSION_SECRET: ${SAKURA_WEB_SESSION_SECRET:?请在 .env 中设置 SAKURA_WEB_SESSION_SECRET}
      SAKURA_SESSION_TTL_HOURS: ${SAKURA_SESSION_TTL_HOURS:-168}
      SAKURA_LOGIN_TTL_SECONDS: ${SAKURA_LOGIN_TTL_SECONDS:-300}
      SAKURA_TASK_WORKER_ENABLED: "0"
      SAKURA_TASK_POLL_SECONDS: ${SAKURA_TASK_POLL_SECONDS:-1}
      SAKURA_TASK_LEASE_SECONDS: ${SAKURA_TASK_LEASE_SECONDS:-45}
      SAKURA_TASK_HEARTBEAT_SECONDS: ${SAKURA_TASK_HEARTBEAT_SECONDS:-12}
      SAKURA_DIAGNOSTIC_INTERVAL_SECONDS: ${SAKURA_DIAGNOSTIC_INTERVAL_SECONDS:-60}
      SAKURA_PROBE_RETENTION_DAYS: ${SAKURA_PROBE_RETENTION_DAYS:-30}
      SAKURA_ALERT_TELEGRAM_IDS: ${SAKURA_ALERT_TELEGRAM_IDS:-}
      SAKURA_OPERATIONS_SYNC_SECONDS: ${SAKURA_OPERATIONS_SYNC_SECONDS:-30}
    volumes: *app-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - sakura

  worker:
    image: ${SAKURA_IMAGE:?请在 .env 中设置 SAKURA_IMAGE}
    restart: unless-stopped
    stop_grace_period: 30s
    command:
      - -m
      - backend.worker
    environment:
      <<: *app-environment
      SAKURA_WEB_SESSION_SECRET: ${SAKURA_WEB_SESSION_SECRET:?请在 .env 中设置 SAKURA_WEB_SESSION_SECRET}
      SAKURA_TASK_POLL_SECONDS: ${SAKURA_TASK_POLL_SECONDS:-1}
      SAKURA_TASK_LEASE_SECONDS: ${SAKURA_TASK_LEASE_SECONDS:-45}
      SAKURA_TASK_HEARTBEAT_SECONDS: ${SAKURA_TASK_HEARTBEAT_SECONDS:-12}
      SAKURA_DIAGNOSTIC_INTERVAL_SECONDS: ${SAKURA_DIAGNOSTIC_INTERVAL_SECONDS:-60}
      SAKURA_PROBE_RETENTION_DAYS: ${SAKURA_PROBE_RETENTION_DAYS:-30}
      SAKURA_ALERT_TELEGRAM_IDS: ${SAKURA_ALERT_TELEGRAM_IDS:-}
      SAKURA_OPERATIONS_SYNC_SECONDS: ${SAKURA_OPERATIONS_SYNC_SECONDS:-30}
    volumes: *app-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - sakura

  web:
    image: ${SAKURA_IMAGE:?请在 .env 中设置 SAKURA_IMAGE}
    restart: unless-stopped
    stop_grace_period: 30s
    command:
      - -m
      - backend.main
    environment:
      <<: *app-environment
      SAKURA_WEB_HOST: 0.0.0.0
      SAKURA_WEB_PORT: "8838"
      SAKURA_FORWARDED_ALLOW_IPS: "${SAKURA_FORWARDED_ALLOW_IPS:-*}"
      SAKURA_WEB_SESSION_SECRET: ${SAKURA_WEB_SESSION_SECRET:?请在 .env 中设置 SAKURA_WEB_SESSION_SECRET}
      SAKURA_BOOTSTRAP_ADMIN_USERNAME: ${SAKURA_BOOTSTRAP_ADMIN_USERNAME:-}
      SAKURA_BOOTSTRAP_ADMIN_PASSWORD: ${SAKURA_BOOTSTRAP_ADMIN_PASSWORD:-}
      SAKURA_SESSION_TTL_HOURS: ${SAKURA_SESSION_TTL_HOURS:-168}
      SAKURA_LOGIN_TTL_SECONDS: ${SAKURA_LOGIN_TTL_SECONDS:-300}
      SAKURA_PUBLIC_BASE_URL: ${SAKURA_PUBLIC_BASE_URL:-}
      SAKURA_COOKIE_SECURE: ${SAKURA_COOKIE_SECURE:-true}
      SAKURA_TRUSTED_HOSTS: "${SAKURA_TRUSTED_HOSTS:-*}"
      SAKURA_CORS_ORIGINS: ${SAKURA_CORS_ORIGINS:-}
      SAKURA_DOCS_ENABLED: ${SAKURA_DOCS_ENABLED:-false}
      SAKURA_LEGACY_API_ENABLED: ${SAKURA_LEGACY_API_ENABLED:-false}
      SAKURA_LEGACY_API_TOKEN: ${SAKURA_LEGACY_API_TOKEN:-}
      SAKURA_EVENT_POLL_SECONDS: ${SAKURA_EVENT_POLL_SECONDS:-1}
      WEB_ADMIN_PATH: ${WEB_ADMIN_PATH:-sakura-console-k7fd92}
      WEB_USER_PATH: ${WEB_USER_PATH:-app}
      SAKURA_HEALTHCHECK_URL: http://127.0.0.1:8838/readyz
    volumes: *app-volumes
    ports:
      - "${SAKURA_WEB_BIND_IP:-127.0.0.1}:${SAKURA_WEB_BIND_PORT:-8838}:8838"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - sakura

volumes:
  mysql_data:

networks:
  sakura:
    driver: bridge
